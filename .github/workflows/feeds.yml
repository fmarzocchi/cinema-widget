name: Aggiorna feed cinema

on:
  # 06:00, 12:00, 18:00 e mezzanotte, ora italiana (il cron di GitHub è in UTC).
  schedule:
    - cron: '0 4,10,16,22 * * *'
  # Pulsante "Run workflow" per lanciarlo a mano.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Niente giri sovrapposti: scrivono sugli stessi file.
concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Scarica la programmazione delle tre sale
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FEED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          RATING_SCALE: '5'
        run: node feeds.mjs

      # docs/ tiene l'ultimo feed buono (serve se una sala un giorno non risponde),
      # debug/ l'HTML delle sale fallite in questo giro.
      - name: Salva i risultati nel repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nessuna novità da salvare."
          else
            git commit -m "Aggiorna programmazione"
            git push
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  pubblica:
    needs: aggiorna
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
