name: Diagnosi fonti voti
on: workflow_dispatch
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prova Metacritic
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          S="$GITHUB_STEP_SUMMARY"
          for slug in oppenheimer the-odyssey resident-evil resident-evil-2026 spider-man-brand-new-day the-super-mario-galaxy-movie a-prophet pusher-ii questo-non-esiste-xyz; do
            curl -sL -A "$UA" -H 'Accept-Language: en-US,en;q=0.8' -o /tmp/p -w "%{http_code} %{size_download} %{url_effective}" --max-time 25 "https://www.metacritic.com/movie/$slug/" > /tmp/w || true
            echo "### $slug: $(cat /tmp/w)" >> "$S"
            echo '```' >> "$S"
            grep -ao '<script[^>]*ld+json[^>]*>[^<]\{0,900\}' /tmp/p | head -2 | cut -c1-900 >> "$S" || true
            grep -ao '"metaScore":[^,]\{0,20\}\|"criticScoreSummary":{[^}]\{0,200\}\|"score":[0-9]\{1,3\},"max":100\|title="Metascore [^"]*"' /tmp/p | head -4 >> "$S" || true
            echo '```' >> "$S"
          done
