name: Diagnosi formati sale
on: workflow_dispatch
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Formati e lingue
        run: |
          cat > d.mjs <<'JS'
          import { appendFileSync } from 'node:fs';
          const S = process.env.GITHUB_STEP_SUMMARY;
          const out = (t) => appendFileSync(S, t + '\n');
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36';
          const oggi = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Rome' }).format(new Date());
          const giorni = [0, 1, 2, 3].map((n) => { const d = new Date(oggi + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); });
          out('## UCI');
          const combo = new Map();
          for (const g of giorni) {
            const r = await (await fetch('https://myuci---uci-backend-production-nfluwp7wga-oc.a.run.app/api/theatres/uci-cinemas-porta-di-roma-roma/programming/' + g, { headers: { 'User-Agent': UA } })).json();
            for (const f of r.data || []) {
              if (f.not_today) continue;
              for (const gr of f.screens || []) for (const [k, vs] of Object.entries(gr || {})) {
                if (!Array.isArray(vs)) { combo.set('NONARRAY ' + k + ' ' + JSON.stringify(vs).slice(0, 200), f.title); continue; }
                for (const v of vs) {
                  const senza = Object.fromEntries(Object.entries(v).filter(([a]) => a !== 'performances'));
                  const p = (v.performances || [])[0] || {};
                  const chiave = `formato=${k} | variante=${JSON.stringify(senza).slice(0, 400)} | perfKeys=${Object.keys(p).join(',')} | perf=${JSON.stringify(p).slice(0, 400)}`;
                  if (!combo.has(chiave)) combo.set(chiave, f.title);
                }
              }
            }
          }
          out('```');
          for (const [k, t] of [...combo.entries()].slice(0, 40)) out(`${t} :: ${k}`);
          out('```');
          out('## Andromeda');
          const home = await (await fetch('https://roma.andromeda.18tickets.it', { headers: { 'User-Agent': UA } })).text();
          const link = [...home.matchAll(/<a[^>]+href=["'][^"']*\/film\/(\d+)[^"']*["'][^>]*>([\s\S]*?)<\/a>/gi)].map((m) => m[1] + ' ' + m[2].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim()).filter((x) => x.length > 8);
          out('```'); out([...new Set(link)].join('\n')); out('```');
          const ids = [...new Set([...home.matchAll(/\/film\/(\d+)/g)].map((m) => m[1]))].slice(0, 3);
          for (const id of ids) {
            await new Promise((r) => setTimeout(r, 3000));
            const h = await (await fetch('https://roma.andromeda.18tickets.it/film/' + id, { headers: { 'User-Agent': UA } })).text();
            const testo = h.replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
            const i = testo.search(/\d{1,2}\/\d{1,2}\/\d{4}/);
            out(`### film ${id}`); out('```'); out(testo.slice(Math.max(0, i - 200), i + 900)); out('```');
            const cls = [...new Set([...h.matchAll(/class="([^"]*(?:sala|room|lingua|lang|format|vers|3d|imax|orario|spett|show)[^"]*)"/gi)].map((m) => m[1]))].slice(0, 30);
            out('classi: ' + cls.join(' | '));
          }
          out('## Troisi');
          const tr = await (await fetch(`https://cinematroisi.liveticket.it/eventi/?data=${oggi}&vista=xtitolo`, { headers: { 'User-Agent': UA } })).text();
          const h1 = [...tr.replace(/<!--[\s\S]*?-->/g, '').matchAll(/<h1[^>]*>([\s\S]*?)<\/h1>/gi)].map((m) => m[1].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim());
          out('```'); out(h1.join('\n')); out('```');
          const sale = [...new Set([...tr.matchAll(/(sala[^<]{0,30})/gi)].map((m) => m[1].trim()))].slice(0, 20);
          out('sale: ' + sale.join(' | '));
          JS
          node d.mjs
