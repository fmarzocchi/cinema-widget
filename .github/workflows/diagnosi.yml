name: Diagnosi fonti voti
on: workflow_dispatch
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prova le fonti
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          prova() {
            curl -sL -A "$UA" -H 'Accept-Language: it-IT,it;q=0.9,en;q=0.8' -o /tmp/p \
              -w "%{http_code} | %{size_download} byte | %{url_effective}" --max-time 25 "$1" > /tmp/w || true
            voti=$(grep -ao '"ratingValue":[^,}]*\|"criticsScore":{[^}]*}\|"audienceScore":{[^}]*}\|"metascore":[^,}]*\|rating-critica[^<]\{0,80\}\|stelle[^<]\{0,40\}' /tmp/p | head -4 | tr '\n' ' ' | cut -c1-300)
            echo "| $(cat /tmp/w) | ${voti} |" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "| esito | voti trovati |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          prova https://datasets.imdbws.com/title.ratings.tsv.gz
          prova https://www.metacritic.com/movie/oppenheimer/
          prova https://www.rottentomatoes.com/m/oppenheimer_2023
          prova "https://www.rottentomatoes.com/search?search=oppenheimer"
          prova https://www.mymovies.it/film/2023/oppenheimer/
          prova "https://www.mymovies.it/ricerca/?q=oppenheimer"
          prova https://www.comingsoon.it/film/oppenheimer/61539/scheda/
          prova https://www.imdb.com/title/tt15398776/
          prova https://m.imdb.com/title/tt15398776/
          zcat -f /tmp/p >/dev/null 2>&1 || true
          curl -sL -A "$UA" --max-time 60 https://datasets.imdbws.com/title.ratings.tsv.gz | zcat | grep -m1 -P '^tt15398776\t' | sed 's/^/IMDb dataset: /' >> "$GITHUB_STEP_SUMMARY" || true
